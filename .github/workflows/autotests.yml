name: Autotests
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: docker build -f autotests/Dockerfile -t boilerplate-autotests:ci .
      - name: Run browser checks in the image
        run: |
          docker run --init --shm-size=1g --name autotests \
            -e PLAYWRIGHT_JUNIT_OUTPUT_FILE=test-results/junit.xml \
            boilerplate-autotests:ci sh -c \
            'npm run lint && npm test -- --reporter=line,html,junit && npm run test:guard'
      - name: Collect browser reports
        if: always()
        run: |
          mkdir -p autotests/playwright/playwright-report autotests/playwright/test-results
          if docker container inspect autotests >/dev/null 2>&1; then
            docker cp autotests:/app/autotests/playwright/playwright-report/. autotests/playwright/playwright-report/ || true
            docker cp autotests:/app/autotests/playwright/test-results/. autotests/playwright/test-results/ || true
            docker rm autotests
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: playwright-reports
          path: |
            autotests/playwright/playwright-report/
            autotests/playwright/test-results/
